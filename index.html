      <div><span>受测者</span><b>${esc(name)}</b></div>
      <div><span>完成题数</span><b>${state.answers.length} / ${BANK.length}</b></div>
      <div><span>作答用时</span><b>${mmss(secs)}</b></div>
      <div><span>总体心理状态</span><b class="ok">良好 · 97/100</b></div>
    </div>

    <h3>维度分数</h3>
    <ul class="scores">
      <li><span>焦虑指数</span><i style="--w:78%"></i><b>78</b></li>
      <li><span>睡眠质量</span><i style="--w:12%"></i><b>无法测量</b></li>
      <li><span>被注视感</span><i style="--w:100%"></i><b>∞</b></li>
      <li><span>回头意愿</span><i style="--w:0%"></i><b>0</b></li>
      <li><span>共情能力</span><i style="--w:2%"></i><b>未检出</b></li>
      <li><span>说谎倾向</span><i style="--w:100%"></i><b>100%</b></li>
    </ul>

    <h3>检测到的 4 处不一致</h3>
    <ol class="incons">
      <li>你在第 3 题选择了「<b>完全没有</b>」，但光标在选项上停留了 ${stay} 秒。</li>
      <li>你的屏幕是 ${LEASE.screen}，但你有 <b>${offscreen}%</b> 的时间没有看着它。</li>
      <li>你的时区是 <b>${esc(LEASE.tz)}</b>。这个时区里，现在只有你在看这个页面。</li>
      <li>你没有回头。<b>一次都没有。</b></li>
    </ol>

    <h3>建议</h3>
    <ul class="advice">
      <li>今晚不要照镜子。如果必须经过，请把镜子转过去。</li>
      <li>如果听见有人叫你的名字，不要回答。第二次叫的时候，再回答。</li>
      <li>不要关灯。灯光是最低限度的礼貌。</li>
      <li>不要再看这个页面。系统备注：这条建议已经太晚了。</li>
    </ul>

    <p class="sig">—— 本报告由系统自动生成，未经人工复核。有效期为 3 分钟。</p>

    <div class="ractions">
      <button class="rbtn" data-act="again">再做一次</button>
      <button class="rbtn" data-act="close">关闭页面</button>
      <button class="rbtn danger" data-act="left">往左看</button>
    </div>
    <div class="rnote" id="rnote"></div>
  </div>`;

  els.report.classList.add('show');
  document.title = '自评报告';
  BGM.setStage(2);
  Sound.level(0.55);

  $$('.rbtn', els.report).forEach(b => {
    b.onclick = async () => {
      const act = b.dataset.act;
      if (act === 'again') {
        try { localStorage.setItem('mj_attempts', String(state.attempts + 1)); } catch (e) { }
        location.reload();
      } else if (act === 'close') {
        try { window.close(); } catch (e) { }
        b.disabled = true;
        b.textContent = '关不掉。';
        const n = $('#rnote');
        n.textContent = '你已经试过了。系统记录：第七次。';
        Face.blur(0.6);
      } else if (act === 'left') {
        enterScene();
      }
    };
  });
}

/* --- 最后的场景 --- */
function sceneSay(text, hold = 1300, cls = '') {
  return new Promise(res => {
    const d = document.createElement('div');
    d.className = 'sline ' + cls;
    const box = $('#sceneLines');
    box.querySelectorAll('.sline:not(.keep)').forEach(el => el.classList.add('old'));
    box.appendChild(d);
    let extra = box.querySelectorAll('.sline').length - 6;
    while (extra-- > 0) {
      const first = box.querySelector('.sline');
      if (!first) break;
      first.remove();
    }
    awaitNextFrame(() => d.classList.add('in'));
    let i = 0;
    const step = () => {
      d.textContent = text.slice(0, ++i);
      if (i < text.length) setTimeout(step, 78);
      else setTimeout(res, hold);
    };
    setTimeout(step, 260);
  });
}
function awaitNextFrame(fn) { requestAnimationFrame(() => requestAnimationFrame(fn)); }

async function enterScene() {
  els.report.classList.remove('show');
  document.body.classList.add('scene');
  document.title = '……';
  $('#scene').classList.add('show');
  Face.scene();
  Sound.level(0.85);
  BGM.setStage(4);
  Sound.startHeart(1000);

  await wait(1800);
  await sceneSay('你选了「往左看」。', 1400);
  await sceneSay('很好。', 1200);
  await sceneSay(state.name + '。', 1500);
  await sceneSay('可是你左边，什么都没有。', 1600);
  await sceneSay('一直都没有。', 1500);
  await sceneSay('有的只是我。', 2200);
  Sound.whisper(-0.5);
  await wait(600);

  const q = document.createElement('div');
  q.className = 'sline q in';
  q.textContent = '我现在可以靠近了吗？';
  $('#sceneLines').appendChild(q);
  const row = document.createElement('div');
  row.className = 'sopts';
  const yes = document.createElement('button'); yes.textContent = '可以';
  const no = document.createElement('button'); no.textContent = '不可以';
  row.appendChild(no); row.appendChild(yes);
  $('#sceneLines').appendChild(row);
  yes.onclick = () => ending(true);
  no.onclick = () => ending(false);
}

/* =========================================================
   夺舍：挣扎（无效）→ 被接管 → 它的问卷
   ========================================================= */
let struggling = false, will = 100, struggleT0 = 0, struggleRAF = 0, pushCount = 0, possessed = false;

function hudRender() {
  const bar = document.querySelector('#hud .hudbar i');
  const pct = $('#hudPct');
  if (!bar) return;
  bar.style.width = Math.max(0, Math.min(100, will)) + '%';
  if (pct) pct.textContent = Math.max(0, Math.round(will)) + '%';
  bar.style.background = will > 60 ? '#7f9e8a' : (will > 28 ? '#b3832b' : '#b3352b');
}

function hudLine(text) {
  const el = $('#hudSub');
  if (!el) return;
  el.textContent = text;
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('on'), 2400);
}

function bodyShake(ms) {
  document.body.classList.remove('shake');
  void document.body.offsetWidth;
  document.body.classList.add('shake');
  setTimeout(() => document.body.classList.remove('shake'), ms || 360);
}

function ripple(x, y) {
  const d = document.createElement('div');
  d.className = 'ripple';
  d.style.left = x + 'px';
  d.style.top = y + 'px';
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 700);
}

async function struggle() {
  if (struggling || possessed) return;
  struggling = true;
  state.locked = true;
  state.done = true;
  will = 100;
  hudRender();

  document.body.classList.add('possess', 'hijack');
  $('#hud').classList.add('show');
  $('#struggle').classList.add('show');
  const btn = $('#pushBtn');
  btn.textContent = '挣　扎';
  btn.style.transform = '';
  btn.classList.remove('dead');
  btn.style.display = '';
  BGM.possess();
  Face.approach();

  struggleT0 = performance.now();
  let last = struggleT0;
  const loop = (now) => {
    if (!struggling) return;
    const dt = Math.min(0.08, (now - last) / 1000);
    last = now;
    const t = (now - struggleT0) / 1000;
    const cap = Math.max(0, 100 - t * 6.1);
    will = Math.min(will, cap);
    will -= dt * 1.8;
    hudRender();
    const pull = Math.min(0.66, t * 0.05);
    document.documentElement.style.setProperty('--pull', pull.toFixed(3));
    if (will <= 0) { will = 0; hudRender(); finishStruggle(); return; }
    struggleRAF = requestAnimationFrame(loop);
  };
  struggleRAF = requestAnimationFrame(loop);

  const beats = [
    [260, '它进来了。'],
    [2400, '手，先借我用一下。'],
    [5100, () => state.name + '，别挣扎。'],
    [7600, '你不是第一个。'],
    [10200, '也不会是最后一个。'],
    [12600, '已经结束了。你只是还没承认。']
  ];
  beats.forEach(([ms, line]) => setTimeout(() => {
    if (!struggling) return;
    hudLine(typeof line === 'function' ? line() : line);
  }, ms));

  [4400, 8000, 11200].forEach((ms) => setTimeout(() => {
    if (!struggling) return;
    will = Math.max(0, will - 19);
    hudRender();
    bodyShake(340);
    Sound.tick(80, 0.22);
    Face.blur(1);
    hudLine('别。');
  }, ms));
}

function onPush(ev) {
  if (!struggling) return;
  pushCount++;
  will = Math.min(100, will + 3.4);
  hudRender();
  Sound.tick(1350 + Math.random() * 500, 0.05);
  ripple(ev.clientX || innerWidth / 2, ev.clientY || innerHeight / 2);
  const btn = $('#pushBtn');
  if (pushCount === 6) btn.textContent = '让 我 出 去';
  if (pushCount === 12) btn.textContent = '不……';
  if (pushCount >= 17) { btn.textContent = '没有反应。'; btn.classList.add('dead'); }
  if (pushCount >= 6) {
    const dx = (Math.random() - 0.5) * 200;
    const dy = (Math.random() - 0.5) * 130;
    btn.style.transform = 'translate(' + dx.toFixed(0) + 'px,' + dy.toFixed(0) + 'px)';
  }
  if (pushCount === 3) hudLine('对，就是这样。');
  if (pushCount === 9) hudLine('你在跟谁较劲？');
  if (pushCount === 14) hudLine('这里不归你管了。');
}

async function finishStruggle() {
  if (!struggling) return;
  struggling = false;
  possessed = true;
  cancelAnimationFrame(struggleRAF);
  document.body.classList.remove('hijack');
  document.documentElement.style.setProperty('--pull', '0');
  $('#struggle').classList.remove('show');
  BGM.cut();
  Sound.sting();
  bodyShake(600);
  Face.approach();
  hudLine('别怕。');
  await wait(560);

  $('#hud').classList.remove('show');
  $('#lid').classList.add('close');
  await wait(1000);

  // 睁眼之后，已经是它的界面
  document.body.classList.remove('scene', 'possess');
  document.body.classList.add('aftermath');
  $('#scene').classList.remove('show');
  Face.fadeOut();
  await wait(700);
  buildAftermath();
  $('#lid').classList.remove('close');
  await wait(1500);
  BGM.lullaby();
  $('#after').classList.add('show');
  hudLine('');
}

function buildAftermath() {
  $('#after').innerHTML = `
    <div class="card">
      <div class="qmeta"><span>明镜心理 · 已接管</span><span class="tag">不需要你同意</span></div>
      <h1 class="big">心理健康自评</h1>
      <p class="lede">你好，${esc(state.name)}。你的身体很合适。里面很安静，我喜欢。</p>
      <ul class="meta"><li>1 道题目</li><li>立即完成</li><li>不需要你回答</li></ul>
      <button class="start" id="afBtn">继　续</button>
      <p class="fine">（我还在。听得见吗。）</p>
    </div>`;
  $('#afBtn').onclick = () => askWho();
}

async function askWho() {
  const box = $('#after');
  box.innerHTML = `
    <div class="card">
      <div class="qmeta"><span>第 1 题 / 1</span><span class="tag">由我作答</span></div>
      <h1 class="qtext" style="font-family:var(--serif)">「你」现在是谁？</h1>
      <div class="options">
        <button class="opt" id="afA"><span class="k">A</span><span class="t">我</span></button>
        <button class="opt" id="afB"><span class="k">B</span><span class="t">不是我</span></button>
      </div>
      <div class="hint" id="afHint"></div>
    </div>`;
  await wait(1500);
  const a = $('#afA'), b = $('#afB');
  if (!a) return;
  a.classList.add('picked');
  Sound.tick(900, 0.06);
  await wait(650);
  b.classList.add('dead');
  b.disabled = true;
  $('#afHint').textContent = '很好。';
  await wait(2400);
  $('#afHint').textContent = '（那我呢。）';
  $('#afHint').style.fontSize = '12px';
  $('#afHint').style.opacity = '.55';
  await wait(2400);
  await finalBlack();
}

async function finalBlack() {
  document.body.classList.add('blackout');
  $('#after').classList.remove('show');
  await wait(1400);
  els.ender.classList.add('show');
  els.ender.innerHTML = '';
  await enderLine('你的手很适合我。', 1900);
  await enderLine('明天早上，你会照常醒来。', 2100);
  await enderLine('只是醒来的那个人，不是你。', 2600);
  await wait(1200);
  BGM.fade(5);
  await enderLine('（放我出去。）', 0, true);
  await wait(2000);
  await enderLine('……', 0, true);
  setTimeout(() => {
    const t = document.createElement('div');
    t.className = 'eline dim';
    t.textContent = '刷新页面可以重新开始。';
    t.style.fontSize = '10px';
    els.ender.appendChild(t);
    awaitNextFrame(() => t.classList.add('in'));
  }, 12000);
}

function enderLine(text, hold, dim) {
  return new Promise(resolve => {
    const d = document.createElement('div');
    d.className = 'eline' + (dim ? ' dim' : '');
    d.textContent = text;
    els.ender.appendChild(d);
    awaitNextFrame(() => d.classList.add('in'));
    setTimeout(resolve, hold || 0);
  });
}

async function ending(allow) {
  $$('.sopts button').forEach(b => { b.disabled = true; });
  $$('.sopts').forEach(r => r.classList.add('gone'));
  if (allow) {
    await sceneSay('好。', 700);
  } else {
    await sceneSay('……那就当你答应了。', 1300);
  }
  await wait(500);
  await struggle();
}

/* =========================================================
   启动
   ========================================================= */
function boot() {
  Face.boot();
  setFavicon('normal');

  try {
    if (state.attempts > 0) {
      const big = $('.big');
      const lede = $('.lede');
      if (big) big.textContent = state.name && state.name !== '匿名' ? '你回来了，' + state.name + '。' : '你回来了。';
      if (lede) lede.textContent = '这是第 ' + (state.attempts + 1) + ' 次。上一次你没有做完。没关系，我们把答案留着。';
    }
  } catch (e) { }

  $('#startBtn').addEventListener('click', async () => {
    Sound.ensure();
    Sound.level(LEVELS[0]);
    BGM.start();
    BGM.setStage(0);
    try { localStorage.setItem('mj_attempts', String(state.attempts + 1)); } catch (e) { }
    $('#card').classList.remove('intro');
    say('会话已建立 · 本地加密 · 不收集个人数据', 900);
    await wait(700);
    show(0);
  });

  setInterval(() => {
    els.clock.textContent = mmss((Date.now() - state.t0) / 1000);
  }, 1000);

  document.addEventListener('pointermove', e => {
    const cur = $('#cur');
    const pull = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--pull')) || 0;
    const px = e.clientX + (innerWidth * 0.5 - e.clientX) * pull;
    const py = e.clientY + (innerHeight * 0.45 - e.clientY) * pull;
    cur.style.left = px + 'px';
    cur.style.top = py + 'px';
    if (state.stage >= 3 && !document.body.classList.contains('scene')) {
      const k = (e.clientX / innerWidth - 0.5) * 4;
      document.documentElement.style.setProperty('--cardx', k.toFixed(2) + 'px');
    }
  }, { passive: true });

  document.addEventListener('pointerdown', e => {
    if (typeof struggling !== 'undefined' && struggling) onPush(e);
  }, true);

  document.addEventListener('keydown', e => {
    if (state.locked || state.done) return;
    if (document.body.classList.contains('scene')) return;
    const m = /^[1-4a-dA-D]$/.test(e.key) ? e.key : null;
    if (!m) return;
    const idx = 'abcd'.includes(m.toLowerCase()) ? 'abcd'.indexOf(m.toLowerCase()) : Number(m) - 1;
    const b = $('.opt')[idx];
    if (b && !b.disabled) { e.preventDefault(); b.click(); }
  });

  // 调试 / 预览入口
  window.__R = {
    async jump(n) {
      $('#card').classList.remove('intro');
      await show(clamp(n, 0, BANK.length - 1), true);
    },
    async pick(k) {
      for (let i = 0; i < 40 && state.locked; i++) await wait(100);
      const b = $$('.opt')[k];
      if (b) b.click();
    },
    skip() { skipTyping(); },
    async toReport() {
      document.body.classList.add('blackout');
      els.card.style.opacity = '0';
      await wait(400);
      showReport();
    },
    scene() { els.report.classList.remove('show'); enterScene(); },
    climax() { startClimax(); },
    async possess() { await struggle(); },
    bgm: () => BGM,
    state
  };
}

boot();
</script>
